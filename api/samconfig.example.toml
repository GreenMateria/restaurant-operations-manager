version = 0.1

[default.deploy.parameters]
stack_name = "esm-operations-api"
region = "ca-central-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
fail_on_empty_changeset = false

# Copy this file to samconfig.toml for local use if desired.
# Do not commit samconfig.toml.
# Fill these placeholders only in your local copy or pass them on the command line.
parameter_overrides = [
  "ApiStageName=prod",
  "DbUrl=jdbc:postgresql://<host>:5432/postgres?sslmode=require",
  "DbUser=<api-db-user>",
  "DbPassword=<api-db-password>",
  "ApiKey=<shared-api-key>",
  "LambdaSubnetIds=<subnet-id-1>,<subnet-id-2>",
  "LambdaSecurityGroupIds=<lambda-security-group-id>",
  "ReservedConcurrency=0",
  "LambdaLogRetentionDays=30"
]
